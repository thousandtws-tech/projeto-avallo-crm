name: avallo-local

services:
  postgres:
    image: postgres:18-alpine
    container_name: avallo-postgres
    environment:
      POSTGRES_DB: Avallo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - avallo-postgres18-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d Avallo"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: avallo-azurite
    command: azurite --skipApiVersionCheck --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --location /data --debug /data/debug.log
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - avallo-azurite-data:/data
    restart: unless-stopped

volumes:
  avallo-postgres18-data:
  avallo-azurite-data:
